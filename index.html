<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart UPI Merchant POS - SGS ONLINE SERVICE</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase JS SDK (v9 Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --danger-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 24px;
        }

        .header i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .currency-symbol {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px 14px 40px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .qr-section {
            margin-top: 24px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        #qrcode img, #qrcode canvas {
            border-radius: 8px;
        }

        .amount-tag {
            color: #0f172a;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-download {
            background: #10b981;
            color: white;
        }

        .btn-download:hover {
            background: #059669;
        }

        .btn-copy {
            background: #64748b;
            color: white;
        }

        .btn-copy:hover {
            background: #475569;
        }

        .supported-apps {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <i class="fa-solid fa-qrcode"></i>
        <h2>Smart UPI POS</h2>
        <p>Instant Dynamic Payment Generator</p>
    </div>

    <!-- Amount Input Box -->
    <div class="input-box">
        <span class="currency-symbol">₹</span>
        <input type="number" id="amount" placeholder="Enter Amount" min="1" step="any" oninput="checkInput()">
    </div>

    <button class="btn-submit" onclick="generateQR()">
        <i class="fa-solid fa-bolt"></i> Generate QR Code
    </button>

    <!-- QR Code Output Display -->
    <div id="qrSection" class="qr-section">
        <div id="amountDisplay" class="amount-tag">₹0.00</div>
        <div id="qrcode"></div>
        
        <div class="action-btns">
            <button class="btn-action btn-download" onclick="downloadJPEG()">
                <i class="fa-solid fa-download"></i> Save JPEG
            </button>
            <button class="btn-action btn-copy" onclick="copyQRImageLink()">
                <i class="fa-solid fa-copy"></i> Copy Link
            </button>
        </div>
    </div>

    <div class="supported-apps">
        Accepts Google Pay, PhonePe, Paytm, BHIM & all UPI Apps
    </div>
</div>

<script>
    // Firebase Realtime Database Config
    const firebaseConfig = {
      apiKey: "AIzaSyDnYNpfLEsGOhTMT1dkDReH4fRA0pgOs94",
      authDomain: "sgs-online-service.firebaseapp.com",
      databaseURL: "https://sgs-online-service-default-rtdb.firebaseio.com",
      projectId: "sgs-online-service",
      storageBucket: "sgs-online-service.firebasestorage.app",
      messagingSenderId: "12707331594",
      appId: "1:12707331594:web:9f5645f5744b7fc7af29f3"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let currentImageUrl = "";

    // On Page Load: Read URL Parameter and Auto Generate QR Code
    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const amtParam = urlParams.get("amt");
        if (amtParam && parseFloat(amtParam) > 0) {
            document.getElementById("amount").value = amtParam;
            generateQR(false); // don't save duplicate entry on auto load
        }
    });

    function checkInput() {
        const val = document.getElementById("amount").value;
        if(val <= 0 || val === "") {
            document.getElementById("qrSection").style.display = "none";
        }
    }

    function generateQR(saveToDb = true) {
        const amount = document.getElementById("amount").value;
        const qrContainer = document.getElementById("qrcode");
        const qrSection = document.getElementById("qrSection");
        const amountDisplay = document.getElementById("amountDisplay");

        if (!amount || amount <= 0) {
            alert("Kripya valid amount enter karein!");
            return;
        }

        // Updated UPI ID from photo: Q341013270@ybl
        const vpa = "Q341013270@ybl"; 
        const upiData = `upi://pay?pa=${encodeURIComponent(vpa)}&pn=${encodeURIComponent("SGS ONLINE SERVICE")}&am=${encodeURIComponent(amount)}&cu=INR`;

        // Direct Normal HTTPS Image Link (No Base64)
        currentImageUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiData)}&size=200&format=png`;

        qrContainer.innerHTML = "";
        
        new QRCode(qrContainer, {
            text: upiData,
            width: 180,
            height: 180,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        amountDisplay.innerText = `Pay: ₹${parseFloat(amount).toLocaleString('en-IN')}`;
        qrSection.style.display = "block";

        // Save Normal Image URL to Firebase
        if (saveToDb) {
            saveToRealtimeDB(amount, currentImageUrl);
        }
    }

    // Save Normal Link to Firebase
    function saveToRealtimeDB(amount, imageUrl) {
        const newRecordRef = database.ref("qr_history").push();
        newRecordRef.set({
            amount: amount,
            imageUrl: imageUrl,
            timestamp: Date.now()
        }).catch(err => console.error("Write Error:", err));
    }

    // Download Image
    function downloadJPEG() {
        if (currentImageUrl) {
            const a = document.createElement("a");
            a.href = currentImageUrl;
            a.download = `UPI_QR_${document.getElementById("amount").value}INR.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } else {
            alert("Pehle QR Code generate karein!");
        }
    }

    // Copy Image Link
    function copyQRImageLink() {
        if (currentImageUrl) {
            copyText(currentImageUrl);
        } else {
            alert("Pehle QR Code generate karein!");
        }
    }

    // Universal Copy
    function copyText(text) {
        if (!text) return;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ Image Link Copied!");
            }).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            alert("✅ Image Link Copied!");
        } catch (err) {
            alert("❌ Copy failed!");
        }
        document.body.removeChild(textArea);
    }
</script>

</body>
</html>
